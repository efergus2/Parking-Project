name: Build and Push Docker images to Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_REPO: astronautjon/is436
  COMPOSE_FILE: src/docker-compose.yml

jobs:
  push_to_registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set TAG
        run: echo "TAG=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build services (docker compose)
        run: |
          docker compose -f "${{ env.COMPOSE_FILE }}" build --pull

      - name: Tag & push into single repo (is436)
        run: |
          set -euo pipefail

          # list services here (adjust if your compose uses different service names)
          SERVICES="backend frontend"

          for svc in $SERVICES; do
            # get the image reference built by compose (image ID or image name)
            IMG_REF="$(docker compose -f "${{ env.COMPOSE_FILE }}" images -q "${svc}")"
            if [ -z "$IMG_REF" ]; then
              echo "ERROR: service '$svc' not found or not built by compose."
              exit 1
            fi

            # tags we will create in the single repo
            TAGGED="${{ env.DOCKER_REPO }}:${svc}-${TAG}"
            LATEST_TAG="${{ env.DOCKER_REPO }}:${svc}-latest"

            # create tags and push
            docker tag "$IMG_REF" "$TAGGED"
            docker tag "$IMG_REF" "$LATEST_TAG"

            docker push "$TAGGED"
            docker push "$LATEST_TAG"

            echo "Pushed $TAGGED and $LATEST_TAG"
          done
        env:
          TAG: ${{ env.TAG }}
