name: Build (compose) and push images to Docker Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_REPO: astronautjon/is436
  COMPOSE_FILE: src/docker-compose.yml

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set TAG (run number)
        run: echo "TAG=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Show compose services (for debug)
        run: |
          echo "Compose file: $COMPOSE_FILE"
          docker compose -f "$COMPOSE_FILE" config --services || true
        env:
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}

      - name: Build services that use build: (backend)
        run: |
          # Build according to the compose file (builds backend from src/backend)
          docker compose -f "$COMPOSE_FILE" build --pull
        env:
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}

      - name: Tag & push images into single Docker Hub repo
        shell: bash
        env:
          DOCKER_REPO: ${{ env.DOCKER_REPO }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail

          # Services present in your compose file
          SERVICES="db backend"

          for svc in $SERVICES; do
            echo "Processing service: $svc"

            if [ "$svc" = "db" ]; then
              # db uses the public mysql:8.0 image — pull it
              SRC_IMAGE="mysql:8.0"
              echo "Pulling ${SRC_IMAGE} ..."
              docker pull "${SRC_IMAGE}"
              SRC_REF="${SRC_IMAGE}"
            else
              # get local image id produced by `docker compose build`
              SRC_REF=$(docker compose -f "$COMPOSE_FILE" images -q "$svc" || true)
              if [ -z "$SRC_REF" ]; then
                echo "::error::Service '$svc' has no built image reference. Make sure compose built it."
                exit 1
              fi
            fi

            TARGET_TAG="${DOCKER_REPO}:${svc}-${TAG}"
            TARGET_LATEST="${DOCKER_REPO}:${svc}-latest"

            echo "Tagging ${SRC_REF} -> ${TARGET_TAG} and ${TARGET_LATEST}"
            docker tag "${SRC_REF}" "${TARGET_TAG}"
            docker tag "${SRC_REF}" "${TARGET_LATEST}"

            echo "Pushing ${TARGET_TAG} ..."
            docker push "${TARGET_TAG}"
            echo "Pushing ${TARGET_LATEST} ..."
            docker push "${TARGET_LATEST}"

            echo "Done $svc"
          done

      - name: Summary
        run: |
          echo "Images pushed to ${DOCKER_REPO}:"
          echo " - ${DOCKER_REPO}:backend-${TAG} and ${DOCKER_REPO}:backend-latest"
          echo " - ${DOCKER_REPO}:db-${TAG} and ${DOCKER_REPO}:db-latest"
