name: Build and Push Docker image to Docker Hub

on: 
  push:

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set image tag (.env)
        # Compose will read variables from .env in the repo root
        run: echo "TAG=${{ github.run_number }}" > .env

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build services from docker-compose (src/docker-compose.yml)
        run: |
          # ensure docker compose uses the file in src/
          docker compose -f src/docker-compose.yml build --pull

      - name: Push services defined in docker-compose
        run: |
          docker compose -f src/docker-compose.yml push
