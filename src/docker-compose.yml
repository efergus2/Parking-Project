version: "3.8"
services:
  db:
    image: mysql:8.0
    container_name: parking_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: parkingdb
      MYSQL_USER: parking_user
      MYSQL_PASSWORD: parking_pass
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: parking_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: parking_user
      DB_PASSWORD: parking_pass
      DB_NAME: parkingdb
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/public:/usr/src/app/public:ro

volumes:
  db-data: